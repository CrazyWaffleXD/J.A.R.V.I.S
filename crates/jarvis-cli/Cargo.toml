[package]
name = "jarvis-cli"
description = "CLI и REPL jarvis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "jarvis"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
jarvis-audio.workspace = true
jarvis-core.workspace = true
jarvis-stt-vosk = { path = "../jarvis-stt-vosk", optional = true }
jarvis-wake = { path = "../jarvis-wake", optional = true }
jarvis-llm-mistral = { path = "../jarvis-llm-mistral" }
jarvis-cmd-open = { path = "../commands/cmd-open" }
jarvis-cmd-weather = { path = "../commands/cmd-weather" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
vosk = ["dep:jarvis-stt-vosk", "dep:jarvis-wake"]
