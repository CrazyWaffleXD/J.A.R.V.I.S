[workspace]
resolver = "2"
members = [
    "crates/jarvis-core",
    "crates/jarvis-cli",
    "crates/jarvis-platform",
    "crates/jarvis-audio",
    "crates/jarvis-stt-vosk",
    "crates/commands/cmd-open",
    "crates/commands/cmd-weather",
    "crates/commands/cmd-volume",
    "crates/commands/cmd-note",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.75"

[workspace.dependencies]
# Внешние зависимости. Новые добавляются только вместе с записью в DECISIONS.md.
anyhow = "1.0"
async-trait = "0.1"
cpal = "0.15"
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
vosk = "0.3"
webbrowser = "1"

# Внутренние крейты.
jarvis-core = { path = "crates/jarvis-core" }
jarvis-platform = { path = "crates/jarvis-platform" }
jarvis-audio = { path = "crates/jarvis-audio" }
jarvis-stt-vosk = { path = "crates/jarvis-stt-vosk" }
